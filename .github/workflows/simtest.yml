name: simtest

on:
  push:
    branches: [main]
    paths: ['Sentinel.m', 'TestHost/**', '.github/workflows/simtest.yml']
  workflow_dispatch:

jobs:
  sim:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib (iphonesimulator, arm64)
        run: |
          set -e
          SYSROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun -sdk iphonesimulator clang -dynamiclib \
            -arch arm64 \
            -miphonesimulator-version-min=15.0 \
            -isysroot "$SYSROOT" \
            -fobjc-arc -fvisibility=hidden -O2 \
            -install_name @rpath/Sentinel_sim.dylib \
            -o Sentinel_sim.dylib Sentinel.m \
            -framework Foundation -framework UIKit -framework Vision \
            -framework CoreGraphics -framework QuartzCore -framework AudioToolbox
          file Sentinel_sim.dylib

      - name: Build test host app
        run: |
          set -e
          mkdir -p TestHost.app
          SYSROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun -sdk iphonesimulator swiftc TestHost/main.swift \
            -sdk "$SYSROOT" -target arm64-apple-ios15.0-simulator \
            -o TestHost.app/TestHost -framework UIKit
          cp TestHost/Info.plist TestHost.app/Info.plist
          cp Sentinel_sim.dylib TestHost.app/Sentinel_sim.dylib
          ls -la TestHost.app

      - name: Boot simulator, inject dylib, run selftest
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -E "iPhone (15|16|14)" | head -1 | grep -oE "[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}")
          echo "Using UDID=$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" TestHost.app
          # arm64 模拟器 DYLD_INSERT 不生效 → TestHost 顶层 dlopen 加载 bundle 内 dylib
          # -sentinel_selftest 1 → NSArgumentDomain，插件改跑内置自测
          xcrun simctl launch "$UDID" wb.sentinelhost -sentinel_selftest 1
          sleep 30
          DATA=$(xcrun simctl get_app_container "$UDID" wb.sentinelhost data)
          echo "data container: $DATA"
          cat "$DATA/Documents/Sentinel.log" > sentinel.log 2>/dev/null || echo "no Sentinel.log"
          cat "$DATA/Documents/Sentinel_selftest.txt" > selftest.txt 2>/dev/null || echo "no selftest.txt"
          echo "================ Sentinel.log ================"
          cat sentinel.log
          echo "=============================================="
          echo "================ selftest.txt ================"
          cat selftest.txt
          echo "=============================================="

      - name: Verdict
        run: |
          PASS=1
          for m in "armed (sentinel v2" "floating ball created" "selftest begin" "panel shown" "alert card shown" "prompt shown" "timing(" "[probe] 安装完成"; do
            if grep -q "$m" sentinel.log; then echo "PASS: $m"; else echo "FAIL: $m"; PASS=0; fi
          done
          # 注意：grep -c 命中 0 条时退出码是 1，不能再 || echo 0，否则会多出一行导致整数比较失败
          NP=$(grep -c "^PASS " selftest.txt 2>/dev/null || true)
          NF=$(grep -c "^FAIL " selftest.txt 2>/dev/null || true)
          NP=${NP:-0}; NF=${NF:-0}
          echo "断言通过 $NP 条，失败 $NF 条"
          if [ "$NF" != "0" ]; then echo "有失败断言："; grep "^FAIL " selftest.txt; PASS=0; fi
          if [ "$NP" -lt 32 ]; then echo "通过断言数不足($NP<32)"; PASS=0; fi
          if [ "$PASS" = "1" ]; then echo "E2E RESULT: ALL PASS"; else echo "E2E RESULT: FAILED"; exit 1; fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-log
          path: |
            sentinel.log
            selftest.txt
